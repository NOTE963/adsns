<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdShorts ∞</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.stage{width:100%;aspect-ratio:16/9;background:#000;position:relative}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.name{font-size:18px;font-weight:800;margin:18px 16px 4px;text-shadow:0 2px 10px #0006;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:13px;margin:0 16px;opacity:.9}
.badge{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;background:#ffd400;color:#000;font-weight:800;font-size:12px;padding:3px 8px;border-radius:4px}
.side{position:absolute;right:10px;bottom:150px;display:flex;flex-direction:column;gap:16px;align-items:center;font-size:11px}
.side button{background:#0006;border:0;color:#fff;font-size:24px;width:50px;height:50px;border-radius:50%}
.side button.on{background:#ff2d55}
.bottom{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.cta{display:block;width:100%;background:#fff;color:#000;border:0;border-radius:10px;font-weight:800;font-size:16px;padding:13px}
.skip{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:#000a;color:#fff;border:1px solid #fff6;border-radius:6px;font-size:13px;padding:8px 12px;opacity:.6}
.skip.ready{opacity:1;border-color:#fff}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;background:#000a;border-radius:20px;padding:4px 12px;font-size:12px}
#msg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;scroll-snap-align:start;text-align:center;padding:0 24px}
#msg button{background:#fff;color:#000;border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:1;pointer-events:none;text-shadow:0 1px 6px #000}
</style></head><body>
<div id="hud">見た広告: <b id="cnt">0</b>本</div>
<div id="feed"><div id="msg"><span id="st">広告を取得中…</span></div></div>
<script>
// 取得元: Internet Archive(キー不要・埋め込み制限なし)の広告(コマーシャル)動画。ジャンルをランダムに切り替えて無限取得
const CATS=["car","automobile","soda","cola","candy","cereal","coffee","toy","soap","detergent","airline","bank","insurance","fashion","shoes","computer","video game","appliance","television","radio","perfume","hotel","travel","pizza","burger","snack","shampoo","camera","watch","motorcycle","pet food","beer","chocolate","telephone","vacuum","refrigerator","jeans","cosmetics","tire","gasoline"];
const feed=document.getElementById('feed'),cnt=document.getElementById('cnt');
let seen=0,cur=null,t0=0,muted=true,fetching=false;
const ids=new Set();
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=a=>a[Math.floor(Math.random()*a.length)];
const status=t=>{const s=document.getElementById('st');if(s)s.textContent=t};

function addCard(v){
 const d=document.createElement('section'),h=Math.floor(Math.random()*360);
 d.className='card';d.style.background=`linear-gradient(160deg,hsl(${h},55%,34%),hsl(${(h+40)%360},55%,10%))`;
 d.dataset.id=v.id;
 d.innerHTML=`<span class="badge">広告</span>
 <div class="stage"></div><div class="name">${esc(v.n)}</div><div class="sub">Internet Archive</div>
 <div class="side"><div><button class="lk">♥</button><div>高評価</div></div><div><button class="sd">${muted?'🔇':'🔊'}</button><div>音</div></div></div>
 <button class="skip">あと5秒</button>
 <div class="bottom"><button class="cta">広告をもっと見る</button></div>`;
 d.querySelector('.lk').onclick=e=>e.target.classList.toggle('on');
 d.querySelector('.sd').onclick=()=>{muted=!muted;
  document.querySelectorAll('.sd').forEach(b=>b.textContent=muted?'🔇':'🔊');
  const vd=cur&&cur.querySelector('video');if(vd)vd.muted=muted};
 d.querySelector('.skip').onclick=e=>{if(e.target.classList.contains('ready'))next()};
 d.querySelector('.cta').onclick=()=>window.open('https://archive.org/details/'+v.id,'_blank','noopener');
 feed.appendChild(d);io.observe(d)}

async function fetchMore(){
 if(fetching)return;fetching=true;
 for(let t=0;t<5;t++){
  try{
   const q=`mediatype:movies AND (title:commercial OR subject:commercial OR subject:advertisement) AND ${R(CATS)}`;
   const pg=1+Math.floor(Math.random()*(t<2?6:1));
   const r=await fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier&fl[]=title&rows=20&page=${pg}&output=json`);
   if(!r.ok){status('取得エラー HTTP '+r.status);continue}
   const docs=((await r.json()).response||{}).docs||[];
   const items=docs.filter(x=>x.identifier&&!ids.has(x.identifier));
   if(items.length){const m=document.getElementById('msg');if(m)m.remove();items.forEach(x=>{ids.add(x.identifier);addCard({id:x.identifier,n:x.title})});fetching=false;return}
  }catch(e){status('取得エラー: '+e.message)}
 }
 fetching=false;
 if(!document.querySelector('.card')){document.getElementById('msg').innerHTML='<span id="st">広告を取得できませんでした</span><button onclick="fetchMore()">再試行</button>'}}

async function play(card){
 if(cur)cur.querySelector('.stage').innerHTML='';
 cur=card;t0=Date.now();cnt.textContent=++seen;
 const stage=card.querySelector('.stage');
 const note=document.createElement('div');note.className='note';note.textContent='読み込み中…';stage.appendChild(note);
 const skipLater=m=>{note.textContent=m;setTimeout(()=>{if(cur===card)next()},2000)};
 let left=0,n=card;while((n=n.nextElementSibling))left++;
 if(left<4)fetchMore();
 try{
  const j=await (await fetch('https://archive.org/metadata/'+card.dataset.id)).json();
  const f=(j.files||[]).filter(x=>/\.mp4$/i.test(x.name)).sort((a,b)=>(+a.size||1e12)-(+b.size||1e12))[0];
  if(cur!==card)return;
  if(!f){skipLater('再生できる動画がありません');return}
  const vd=document.createElement('video');
  vd.setAttribute('muted','');vd.setAttribute('playsinline','');vd.setAttribute('webkit-playsinline','');
  vd.preload='auto';vd.muted=muted;vd.playsInline=true;
  vd.poster='https://archive.org/services/img/'+card.dataset.id;
  vd.src=`https://archive.org/download/${card.dataset.id}/${encodeURIComponent(f.name)}`;
  vd.onloadedmetadata=()=>{if(vd.duration>120)vd.currentTime=Math.random()*(vd.duration-40)};
  vd.onplaying=()=>note.remove();
  vd.onended=next;
  vd.onerror=()=>skipLater('動画エラー('+(vd.error?vd.error.code:'?')+')');
  stage.insertBefore(vd,note);
  vd.play().catch(()=>{note.textContent='タップして再生';stage.onclick=()=>{vd.play();stage.onclick=null}});
  setTimeout(()=>{if(cur===card&&note.isConnected&&note.textContent==='読み込み中…')note.textContent='読み込みに時間がかかっています…'},6000);
 }catch(e){skipLater('取得エラー: '+e.message)}}
function next(){const n=cur&&cur.nextElementSibling;if(n)n.scrollIntoView({behavior:'smooth'});else fetchMore()}

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.target!==cur)play(e.target)}),{root:feed,threshold:.6});
setInterval(()=>{if(!cur)return;const s=(Date.now()-t0)/1000,k=cur.querySelector('.skip');
 if(s>=5){k.classList.add('ready');k.textContent='スキップ ▶'}else k.textContent='あと'+Math.ceil(5-s)+'秒';
 if(s>=30)next()},200);
fetchMore();
</script></body></html>
