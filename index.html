<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdShorts ∞</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.stage{width:100%;aspect-ratio:16/9;background:#000;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.name{font-size:18px;font-weight:800;margin:18px 16px 4px;text-shadow:0 2px 10px #0006;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:13px;margin:0 16px;opacity:.9}
.badge{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;background:#ffd400;color:#000;font-weight:800;font-size:12px;padding:3px 8px;border-radius:4px}
.side{position:absolute;right:10px;bottom:150px;display:flex;flex-direction:column;gap:16px;align-items:center;font-size:11px}
.side button{background:#0006;border:0;color:#fff;font-size:24px;width:50px;height:50px;border-radius:50%}
.side button.on{background:#ff2d55}
.bottom{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.cta{display:block;width:100%;background:#fff;color:#000;border:0;border-radius:10px;font-weight:800;font-size:16px;padding:13px;margin-bottom:8px}
.skip{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:#000a;color:#fff;border:1px solid #fff6;border-radius:6px;font-size:13px;padding:8px 12px;opacity:.6}
.skip.ready{opacity:1;border-color:#fff}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;background:#000a;border-radius:20px;padding:4px 12px;font-size:12px}
#msg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;scroll-snap-align:start;text-align:center;padding:0 24px}
#msg button{background:#fff;color:#000;border:0;border-radius:8px;padding:10px 18px;font-weight:700}
</style></head><body>
<div id="hud">見た広告: <b id="cnt">0</b>本</div>
<div id="feed"><div id="msg">広告を取得中…</div></div>
<script>
// ジャンル × 言い方 をランダムに組み合わせて検索 → 毎回ちがう広告が出ます
const CATS=["自動車","飲料","ビール","お菓子","ファストフード","化粧品","スキンケア","ファッション","スニーカー","家電","スマホ","ゲーム","アプリ","旅行","航空会社","ホテル","銀行","保険","不動産","通販","スーパー","コンビニ","シャンプー","洗剤","ペットフード","時計","香水","映画","アニメ","音楽配信","英会話","転職","引っ越し","ビール","コーヒー","電車","スポーツ","バイク","家具","おもちゃ","car","soda","sneakers","perfume","airline","fast food","beer","smartphone","video game","fashion","beauty","insurance","hotel","coffee","chocolate","energy drink","watch","bank","electric car","pizza","toy","shampoo","detergent","travel"];
const SUF=["CM","TVCM","commercial","広告","advert","ad"];
const feed=document.getElementById('feed'),cnt=document.getElementById('cnt');
let seen=0,cur=null,t0=0,muted=true,fetching=false,fails=0;
const ids=new Set();
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=a=>a[Math.floor(Math.random()*a.length)];
const src=(id,m)=>`https://www.dailymotion.com/embed/video/${id}?autoplay=1&mute=${m?1:0}&queue-enable=false&ui-logo=0`;

function addCard(v){
 const d=document.createElement('section'),h=Math.floor(Math.random()*360);
 d.className='card';d.style.background=`linear-gradient(160deg,hsl(${h},55%,34%),hsl(${(h+40)%360},55%,10%))`;
 d.dataset.id=v.id;d.dataset.len=v.len||0;
 d.innerHTML=`<span class="badge">広告</span>
 <div class="stage"></div><div class="name">${esc(v.n)}</div><div class="sub">${esc(v.o)}</div>
 <div class="side"><div><button class="lk">♥</button><div>高評価</div></div><div><button class="sd">${muted?'🔇':'🔊'}</button><div>音</div></div></div>
 <button class="skip">あと5秒</button>
 <div class="bottom"><button class="cta">広告をもっと見る</button></div>`;
 d.querySelector('.lk').onclick=e=>e.target.classList.toggle('on');
 d.querySelector('.sd').onclick=()=>{muted=!muted;
  document.querySelectorAll('.sd').forEach(b=>b.textContent=muted?'🔇':'🔊');
  const f=cur&&cur.querySelector('iframe');if(f)f.src=src(cur.dataset.id,muted)};
 d.querySelector('.skip').onclick=e=>{if(e.target.classList.contains('ready'))next()};
 d.querySelector('.cta').onclick=()=>window.open('https://www.dailymotion.com/video/'+v.id,'_blank','noopener');
 feed.appendChild(d);io.observe(d)}

async function fetchMore(){
 if(fetching)return;fetching=true;
 for(let t=0;t<4;t++){
  try{
   const q=R(CATS)+' '+R(SUF),pg=1+Math.floor(Math.random()*3);
   const r=await fetch(`https://api.dailymotion.com/videos?search=${encodeURIComponent(q)}&fields=id,title,duration,owner.screenname&shorter_than=2&family_filter=1&limit=20&page=${pg}`);
   const j=await r.json();
   const items=(j.list||[]).filter(v=>v.id&&!ids.has(v.id)).map(v=>(ids.add(v.id),{id:v.id,n:v.title,o:v['owner.screenname'],len:v.duration}));
   if(items.length){const m=document.getElementById('msg');if(m)m.remove();items.forEach(addCard);fails=0;fetching=false;return}
  }catch(e){}
 }
 fails++;fetching=false;
 if(!cur&&!document.querySelector('.card')){document.getElementById('msg').innerHTML='広告を取得できませんでした<br>ネットワークを確認してください<button onclick="fetchMore()">再試行</button>'}}

function play(card){
 if(cur)cur.querySelector('.stage').innerHTML='';
 cur=card;t0=Date.now();cnt.textContent=++seen;
 const f=document.createElement('iframe');
 f.src=src(card.dataset.id,muted);f.allow='autoplay; encrypted-media; picture-in-picture';f.referrerPolicy='strict-origin-when-cross-origin';
 card.querySelector('.stage').appendChild(f);
 let left=0,n=card;while((n=n.nextElementSibling))left++;
 if(left<4)fetchMore()}
function next(){const n=cur&&cur.nextElementSibling;if(n)n.scrollIntoView({behavior:'smooth'});else fetchMore()}

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.target!==cur)play(e.target)}),{root:feed,threshold:.6});
setInterval(()=>{if(!cur)return;const s=(Date.now()-t0)/1000,k=cur.querySelector('.skip'),len=+cur.dataset.len;
 if(s>=5){k.classList.add('ready');k.textContent='スキップ ▶'}else k.textContent='あと'+Math.ceil(5-s)+'秒';
 if(s>=Math.min(len||30,45)+1)next()},200);
fetchMore();
</script></body></html>
